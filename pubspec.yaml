name: ders_programi_app
description: "Universite ders programı ve ajanda uygulaması."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Durum Yonetimi
  provider: ^6.1.2

  # Firebase Baglantilari
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0

  # Yerel Veri Depolama
  shared_preferences: ^2.2.2

  # Arayuz ve Fontlar
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true